[package]
name = "system-dashboard"
version = "0.1.1"
edition = "2021"
description = "Minimalist system dashboard for the Argon ONE UP — battery, power profile, idle state, theme, fan"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
i2cdev = "0.6"
