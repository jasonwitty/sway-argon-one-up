# Palette for the Quickshell network and Bluetooth panels (quickshell-panels/).
# Rendered by switch-theme to ~/.config/quickshell/panels/theme/colors.toml;
# the panel watches that file, so a theme switch recolours it live.
foreground = "#@@TEXT@@"
background = "#@@BASE@@"
accent = "#@@BLUE@@"
urgent = "#@@RED@@"
muted = "#@@OVERLAY0@@"
