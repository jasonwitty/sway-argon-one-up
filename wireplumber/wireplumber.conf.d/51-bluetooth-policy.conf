# WirePlumber policy: auto-route audio to Bluetooth devices on connect.
#
# A BT sink gets priority.session = 2000 (above the ~1000 used by
# ALSA/USB sinks). WirePlumber's default-node rescan hook picks the
# highest-priority session as the default, so a newly-connected BT
# device takes over playback automatically. Existing streams follow
# because linking.follow-default-target defaults to true.
#
# Also enables SBC-XQ (higher-quality SBC variant) and mSBC (wideband
# voice for HFP) when the device supports them.
#
# NOTE: bluez5.roles / bluez5.auto-connect are left at defaults — an
# explicit override of these was observed to suppress A2DP profile
# enumeration in testing.
#
# autoswitch-to-headset-profile is disabled: by default WirePlumber flips
# a BT device to mono HFP/headset whenever any app holds a mic input
# stream (e.g. a browser tab), which silently drops it out of A2DP stereo
# and — worse — can leave it connected HFP-only with no playback sink at
# all, so the priority rule below has nothing to promote. We keep BT
# output on A2DP and use a separate source for mic capture.
#
# To apply after editing:
#     systemctl --user restart wireplumber
# (or, without restarting: wpctl settings --save bluetooth.autoswitch-to-headset-profile false)

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # SBC-XQ is OFF deliberately. It sounds better (~450-550kbps vs ~330) but it
  # clipped in and out on this hardware — twice on 2026-08-03 with the phone's
  # Bluetooth off, so not multipoint contention. Leaving it enabled also meant a
  # WirePlumber restart silently re-selected the XQ profile and brought the
  # dropouts back. Plain SBC is still 48kHz stereo A2DP. Re-enable (true) to
  # retry XQ once the realtime-priority fix has had a full session to prove
  # itself — the user was missing from the @pipewire group, so PipeWire had NO
  # RT scheduling at all while these dropouts were happening.
  bluez5.enable-sbc-xq    = false
  bluez5.enable-msbc      = true
  bluez5.enable-hw-volume = true
}

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
        # Buffer headroom against audible clipping. Diagnosed 2026-08-03: audio
        # cut in and out on this Pi while PipeWire had NO realtime priority at
        # all (every thread SCHED_OTHER — /etc/security/limits.d/25-pw-rlimits.conf
        # grants rtprio only to group @pipewire and the user was not in it) with
        # the governor pinned at 1.5GHz in powersave and load ~2.4. A late data
        # thread with a 1024-frame (21ms) quantum drops audio; 2048 (~43ms)
        # doubles the margin. Irrelevant for music/video — only matters if you
        # need low-latency monitoring, in which case drop it back to 1024.
        #
        # MUST be force-quantum, not node.latency: PipeWire runs the graph at the
        # SMALLEST latency any linked client asks for, so a browser requesting
        # 1024 pins the whole graph there and node.latency on the sink silently
        # has no effect (verified — the prop landed, QUANT stayed 1024).
        # force-quantum on the driver node overrides client requests.
        node.force-quantum = 2048
      }
    }
  }
]
