# Hand the power key to power-button-guard instead of powering off instantly.
#
# The stock default is HandlePowerKey=poweroff, which shuts the machine down on
# a bare tap -- including the tap you use to wake it from suspend.
[Login]
HandlePowerKey=ignore

# Backstop only. systemd's long-press threshold is hardcoded at 5s and is not
# configurable, which is why the 4s force-off lives in the daemon instead.
# This just means a very long hold still works if the daemon is not running
# (greeter, crashed unit, user service disabled).
HandlePowerKeyLongPress=poweroff
