# Installed as /etc/systemd/system/greetd.service.d/override.conf
#
# The packaged unit caps restarts at StartLimitBurst=5 / StartLimitInterval=30 with
# RestartSec=1. A greeter that fails fast (e.g. booted with the lid closed, so sway has
# no output — see greetd-wait-display.sh) burns all five attempts in ~11 seconds and
# greetd is then dead for the rest of the boot, with no login prompt and no retry.
#
# Retry forever instead, at a calmer interval, and don't even try until a display is
# actually connected.

[Unit]
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
RestartSec=5
ExecStartPre=/usr/local/bin/greetd-wait-display
