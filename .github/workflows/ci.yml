name: CI

on:
  push:
    branches: [main, 'v.*']
  # Every PR, whatever its base: PRs stacked on a feature branch or aimed at a
  # release-candidate branch used to merge with no checks at all.
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [argon-battery-rs, argon-lid-monitor, trackpad-guard, power-button-guard]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all -W clippy::perf -D warnings

      - name: Tests
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  argon-fan:
    name: argon-fan checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argon-fan
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all -W clippy::perf -D warnings

      - name: Tests
        run: cargo test --release

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit
        run: cargo audit

  system-dashboard:
    name: system-dashboard checks
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: system-dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -W clippy::all -W clippy::perf -D warnings

      - name: Tests
        run: cargo test --locked

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: |
          shellcheck bin/* sbin/* install.sh \
            touchpad-native/touchpad-mode greetd/*.sh \
            trackpad-guard/scripts/*.sh \
            quickshell-panels/quickshell-build/*.sh installer-test/test.sh
